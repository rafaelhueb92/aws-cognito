name: Deploy to AWS

on:
  push:
    branches:
      - main

env:
  ACTIONS_STEP_DEBUG: true
  AWS_DEBUG: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set environment variables
        run: |
          echo "REPO_NAME=${{ github.repository }}" >> $GITHUB_ENV
          echo "ROLE_NAME=GitHubActionsRole" >> $GITHUB_ENV
          echo "ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Concatenate environment variables to create IAM Role ARN
        run: |
          ARN="arn:aws:iam::$ACCOUNT_ID:role/$ROLE_NAME-${REPO_NAME#*/}"
          echo "The IAM Role ARN is: $ARN"
          echo "ROLE_ARN=$ARN" >> $GITHUB_ENV
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1 
      
      - name: Clear AWS Credentials Cache
        run: rm -rf ~/.aws/cli/cache
      
      - name: Configure backend.hcl file
        run: bash backend-create.sh
        working-directory: ./terraform
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.4.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
      
      - name: Read destroy.txt
        id: check_destroy
        run: |
          DESTROY=$(cat destroy.txt)
          echo "Destroy value: $DESTROY"
          echo "destroy_flag=$DESTROY" >> $GITHUB_ENV
        working-directory: ./terraform

      - name: Terraform Destroy
        if: env.destroy_flag == 'true'
        run: |
          terraform destroy -var="cognito_email=${{ secrets.COGNITO_EMAIL }}" -var="cognito_password=${{ secrets.COGNITO_PWD }}" -auto-approve
          exit 0
        working-directory: ./terraform

      - name: Terraform Apply
        if: env.destroy_flag != 'true'
        run: terraform apply -var="cognito_email=${{ secrets.COGNITO_EMAIL }}" -var="cognito_password=${{ secrets.COGNITO_PWD }}" -auto-approve
        working-directory: ./terraform

      - name: Destroy Terraform resources if anything goes wrong
        run: terraform destroy -var="cognito_email=${{ secrets.COGNITO_EMAIL }}" -var="cognito_password=${{ secrets.COGNITO_PWD }}" -auto-approve
        working-directory: ./terraform
        if: failure()  
